name: postinstall-build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless signing via Sigstore OIDC

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./hcloud-postinstall

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcloud-postinstall
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ocalzi/hcloud-postinstall
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Vendor-neutral build: buildah (Red Hat / Podman ecosystem) rather
      # than docker/build-push-action. Produces an OCI-format image and
      # pushes it via podman-login — no Docker daemon involved.
      - name: Build image
        id: buildah
        uses: redhat-actions/buildah-build@v2
        with:
          context: ./hcloud-postinstall
          containerfiles: ./hcloud-postinstall/Containerfile
          image: hcloud-postinstall
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: ghcr.io/ocalzi

      # ---------------- Sigstore: sign + SBOM-attest ----------------------
      # Keyless: cosign exchanges the GH Actions OIDC token for a short-lived
      # Sigstore certificate, signs by digest (immutable), and publishes the
      # signature to the public Rekor transparency log. No long-lived secrets.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign image (cosign keyless)
        env:
          DIGEST_REF: ghcr.io/ocalzi/hcloud-postinstall@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Generate SBOM + cosign attest
        env:
          DIGEST_REF: ghcr.io/ocalzi/hcloud-postinstall@${{ steps.push.outputs.digest }}
        run: |
          syft "$DIGEST_REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$DIGEST_REF"
