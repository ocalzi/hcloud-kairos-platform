name: postinstall-build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./hcloud-postinstall

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcloud-postinstall
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ocalzi/hcloud-postinstall
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Vendor-neutral build: buildah (Red Hat / Podman ecosystem) rather
      # than docker/build-push-action. Produces an OCI-format image and
      # pushes it via podman-login — no Docker daemon involved.
      - name: Build image
        id: buildah
        uses: redhat-actions/buildah-build@v2
        with:
          context: ./hcloud-postinstall
          containerfiles: ./hcloud-postinstall/Containerfile
          image: hcloud-postinstall
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: ghcr.io/ocalzi
