name: postinstall-build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          apk add --no-cache shellcheck || apt-get update && apt-get install -y shellcheck
          shellcheck hcloud-postinstall/post-install.sh

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcloud-postinstall
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/ocalzi/hcloud-postinstall
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Vendor-neutral build: buildah produces an OCI-format image. Pushed
      # via podman-login — Quay.io is itself part of the Red Hat / OCI
      # ecosystem, so the whole chain stays daemonless and Docker-free.
      - name: Build image
        id: buildah
        uses: redhat-actions/buildah-build@v2
        with:
          context: ./hcloud-postinstall
          containerfiles: ./hcloud-postinstall/Containerfile
          image: hcloud-postinstall
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      - name: Log in to Quay
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: quay.io/ocalzi

      # Cosign signing is *not* configured for Gitea Actions: Sigstore's public
      # good instance does not (as of 2026-01) trust Gitea's OIDC issuer for
      # keyless signing. To add it, generate a long-lived cosign key pair
      # (`cosign generate-key-pair`) and inject COSIGN_PRIVATE_KEY +
      # COSIGN_PASSWORD as Gitea secrets, then add a `cosign sign --key
      # env://COSIGN_PRIVATE_KEY <ref>` step here. The GitHub workflow does
      # keyless signing — see .github/workflows/postinstall-build.yml.
