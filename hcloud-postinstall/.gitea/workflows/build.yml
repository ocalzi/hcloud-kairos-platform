name: build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          apk add --no-cache shellcheck || apt-get update && apt-get install -y shellcheck
          shellcheck hcloud-postinstall/post-install.sh

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcloud-postinstall
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/ocalzi/hcloud-postinstall
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./hcloud-postinstall
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
