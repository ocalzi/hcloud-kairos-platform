stages:
  - lint
  - build

# Vendor-neutral build pipeline: buildah (no Docker daemon, no dind, no
# Docker Inc components). Storage driver pinned to vfs because most GitLab
# shared runners do not expose /dev/fuse to non-privileged jobs.
variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: oci

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine
  script:
    - shellcheck post-install.sh

build:
  stage: build
  image: quay.io/buildah/stable:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah bud
        --file Containerfile
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        --tag "$CI_REGISTRY_IMAGE:latest"
        .
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - buildah push "$CI_REGISTRY_IMAGE:latest"
