stages:
  - validate
  - lint
  - build

# Vendor-neutral image build for hcloud-postinstall: buildah (no Docker
# daemon, no dind). Storage driver pinned to vfs because most GitLab
# shared runners do not expose /dev/fuse to non-privileged jobs.
variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: oci

# --- Validate stage: tofu fmt + validate on every push -----------------------

.tofu_validate:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.6.0
  before_script:
    - cd "$PROJECT_DIR"
  script:
    - tofu fmt -check -recursive
    - tofu init -backend=false
    - tofu validate

tofu:hcloud-mgmt:
  extends: .tofu_validate
  variables:
    PROJECT_DIR: hcloud-mgmt

tofu:ovh-mgmt:
  extends: .tofu_validate
  variables:
    PROJECT_DIR: ovh-mgmt

# --- Lint + Build stages: shellcheck + buildah for hcloud-postinstall -------

shellcheck:postinstall:
  stage: lint
  image: koalaman/shellcheck-alpine
  before_script:
    - cd hcloud-postinstall
  script:
    - shellcheck post-install.sh

build:postinstall:
  stage: build
  image: quay.io/buildah/stable:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  before_script:
    - cd hcloud-postinstall
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah bud
        --file Containerfile
        --tag "$CI_REGISTRY_IMAGE/hcloud-postinstall:$CI_COMMIT_TAG"
        --tag "$CI_REGISTRY_IMAGE/hcloud-postinstall:latest"
        .
    - buildah push "$CI_REGISTRY_IMAGE/hcloud-postinstall:$CI_COMMIT_TAG"
    - buildah push "$CI_REGISTRY_IMAGE/hcloud-postinstall:latest"
